---
# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
on:
    pull_request:
        paths-ignore:
            - "README.md"
            - "CHANGELOG.md"
            - "docs/**"
    push:
        branches:
            - main
        paths-ignore:
            - "README.md"
            - "CHANGELOG.md"
            - "docs/**"

# Testing only needs permissions to read the repository contents.
permissions:
    contents: read

jobs:
    # Ensure project builds before running testing matrix
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: "go.mod"
                  cache: true
            - run: go mod download
            - run: go build -v .
            - name: Run linters
              uses: golangci/golangci-lint-action@v9
              with:
                  version: latest

    generate:
        name: Documentation Generation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: "go.mod"
                  cache: true
            # We need the latest version of Terraform for our documentation generation
            - uses: hashicorp/setup-terraform@v4
              with:
                  terraform_wrapper: false
            - run: go generate ./...
            - name: git diff
              run: |
                  git diff --compact-summary --exit-code || \
                    (echo; echo "Unexpected difference in directories after code generation."; \
                     echo "Run 'go generate ./...' command and commit."; exit 1)

    # Run unit tests
    unit-test:
        name: Unit Tests
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: "go.mod"
                  cache: true
            - run: go mod download
            - run: go test -v -cover ./internal/provider/
              timeout-minutes: 5

    # Run acceptance tests against both Terraform and OpenTofu across
    # a sampling of supported minor versions. No external credentials
    # are required: jwt resources do not call any external service,
    # so all acceptance steps run hermetically.
    #
    # For OpenTofu rows, TF_ACC_TERRAFORM_PATH is pointed at the
    # `tofu` binary so terraform-plugin-testing drives the CLI side
    # of the acceptance harness against OpenTofu instead of Terraform.
    acceptance-test:
        name: Acceptance (${{ matrix.tool }} ${{ matrix.version }})
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Terraform: sample older, middle, and current minors.
                    - tool: terraform
                      version: "1.11.*"
                    - tool: terraform
                      version: "1.13.*"
                    - tool: terraform
                      version: "1.15.*"
                    # OpenTofu: previous and current minors.
                    - tool: opentofu
                      version: "1.11.*"
                    - tool: opentofu
                      version: "1.12.*"
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: "go.mod"
                  cache: true
            - if: matrix.tool == 'terraform'
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: ${{ matrix.version }}
                  terraform_wrapper: false
            - if: matrix.tool == 'opentofu'
              uses: opentofu/setup-opentofu@v2
              with:
                  tofu_version: ${{ matrix.version }}
                  tofu_wrapper: false
            - if: matrix.tool == 'opentofu'
              name: Point TF_ACC_TERRAFORM_PATH at the tofu binary
              run: echo "TF_ACC_TERRAFORM_PATH=$(which tofu)" >> "$GITHUB_ENV"
            - run: go mod download
            - env:
                  TF_ACC: "1"
              run: go test -v -cover ./internal/provider/
              timeout-minutes: 10
